use_default_settings: true

general:
  instance_name: "Perplexity Local SearXNG"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json

server:
  # Defina SEARXNG_SECRET no ambiente/.env (gere com: openssl rand -hex 32)
  secret_key: "${SEARXNG_SECRET}"
  limiter: true
  image_proxy: false
  method: "POST"

engines:
  - name: yandex
    engine: yandex
    shortcut: ya
    disabled: false
    timeout: 4.5
