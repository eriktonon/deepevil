version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: perplexity_searxng
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

  perplexity_local:
    build: .
    container_name: saas_perplexity_local
    depends_on:
      - searxng
    ports:
      - "127.0.0.1:${HOST_PORT:-8240}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/perplexity.sqlite
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-searxng}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-eriktonon/granite4.2-uncensored:latest}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - MAX_CHARS_PER_SOURCE=${MAX_CHARS_PER_SOURCE:-5500}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - perplexity_sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  perplexity_sqlite_data:
