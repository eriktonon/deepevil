stages:
  - validate
  - test
  - security
  - build
  - deploy

variables:
  NODE_ENV: test
  OLLAMA_MODEL: eriktonon/deepseek-v4.1-flash-1017:9b

default:
  image:
    name: node:22.14-alpine3.21
    pull_policy: [if-not-present, always]
  before_script:
    - apk add --no-cache python3 make g++ git
    - npm ci

validate_syntax:
  stage: validate
  script:
    - node --check src/server.js
    - node --check src/search.js
    - node --check src/extractor.js
    - node --check src/llm.js
    - node --check src/render.js
    - node --check src/db.js
    - node --check src/qdrant.js

test_suite:
  stage: test
  script:
    - npm test

security_audit:
  stage: security
  script:
    - npm audit --omit=dev --audit-level=high || true
    - node --test tests/security.test.js

build_container:
  stage: build
  image:
    name: docker:27-cli
    pull_policy: [if-not-present, always]
  before_script: []
  script:
    - docker build --pull=false -t deepevil:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA} -t deepevil:stable .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^(v\d+\.\d+\.\d+|stable)$/

deploy_release:
  stage: deploy
  image:
    name: alpine:3.21
    pull_policy: [if-not-present, always]
  before_script: []
  script:
    - echo "Release ${CI_COMMIT_TAG:-stable} validated and ready for deployment (OLLAMA_MODEL=${OLLAMA_MODEL})"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^(v\d+\.\d+\.\d+|stable)$/
